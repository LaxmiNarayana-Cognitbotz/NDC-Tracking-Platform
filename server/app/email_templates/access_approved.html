<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="x-apple-disable-message-reformatting">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* {{ font_css }} */
  body { margin: 0; padding: 0; background-color: #f8fafc; font-family: 'Adani', 'Rubik', Arial, sans-serif; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table { border-collapse: collapse; }
  .wrapper { width: 100% !important; background-color: #f8fafc; padding: 20px 10px; }
  .container { width: 100% !important; max-width: 800px !important; margin: 0 auto; background-color: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  @media only screen and (max-width: 600px) {
    .wrapper { padding: 10px 4px !important; }
    .header { padding: 16px 14px 10px 14px !important; }
    .header h2 { font-size: 17px !important; line-height: 1.3 !important; }
    .content { padding: 16px 12px !important; font-size: 13px !important; }
  }
</style>
</head>
<body style="background-color:#f8fafc;font-family:'Adani','Rubik',Arial,sans-serif;margin:0;padding:0;">
<table width="100%" border="0" cellspacing="0" cellpadding="0" bgcolor="#f8fafc" class="wrapper" style="background-color:#f8fafc;width:100%;padding:20px 10px;">
  <tr>
    <td align="center">
      <table class="container" width="100%" border="0" cellspacing="0" cellpadding="0" style="width:100%;max-width:800px;margin:0 auto;background-color:#ffffff;border-radius:8px;border:1px solid #e2e8f0;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05);border-collapse:separate;">
        <!-- Header -->
        <tr>
          <td class="header" style="padding:22px 28px 14px 28px;border-bottom:2px solid #16a34a;background-color:#ffffff;">
            <h2 style="margin:0;font-family:'Adani','Rubik',Arial,sans-serif;font-size:20px;font-weight:700;color:#16a34a;letter-spacing:-0.2px;">NDC System — Access Granted</h2>
          </td>
        </tr>
        <!-- Content Area -->
        <tr>
          <td class="content" style="padding:24px 28px;color:#333333;font-family:'Adani','Rubik',Arial,sans-serif;font-size:14px;line-height:1.65;">
            <p style="margin:0 0 14px 0;font-weight:normal;color:#333333;">Dear {{ name }},</p>
            <p style="margin:0 0 14px 0;color:#333333;">Your access request to the <b>NDC &amp; F&amp;F Tracking and Reporting System</b> has been approved by the administrator.</p>
            <p style="margin:0 0 20px 0;color:#333333;">You can now log in to the portal using your Adani corporate account.</p>

            <table border="0" cellspacing="0" cellpadding="0" style="margin:24px 0;">
              <tr>
                <td align="center" bgcolor="#16a34a" style="border-radius:6px;background-color:#16a34a;">
                  <a href="{{ portal_link }}" target="_blank" style="font-family:'Adani','Rubik',Arial,sans-serif;font-size:13.5px;font-weight:bold;color:#ffffff;text-decoration:none;display:inline-block;padding:12px 24px;border-radius:6px;background-color:#16a34a;">GO TO NDC TRACKING SYSTEM</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td class="footer" bgcolor="#f8fafc" style="padding:18px 28px;background-color:#f8fafc;color:#64748b;border-top:1px solid #e2e8f0;font-family:'Adani','Rubik',Arial,sans-serif;font-size:12px;line-height:1.5;">
            Regards,<br>
            <strong style="color:#003b70;">HR Team | NDC Tracking Platform</strong>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
